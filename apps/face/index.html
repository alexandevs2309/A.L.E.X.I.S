<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALEXIS · Digital Presence</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #05090f; overflow: hidden; }
    #face-root { position: fixed; inset: 0; }
    #composer { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); width: min(560px, 90vw); z-index: 10; }
    #composer form { display: flex; gap: 8px; background: rgba(10, 21, 34, 0.72); border: 1px solid rgba(125, 211, 238, 0.25); border-radius: 14px; padding: 8px 10px; backdrop-filter: blur(6px); }
    #composer input { flex: 1; background: transparent; border: 0; outline: none; color: #d7ecff; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
    #composer button { background: #19b7f5; color: #03121f; border: 0; border-radius: 10px; padding: 8px 18px; font-weight: 700; cursor: pointer; }
    #hud { position: fixed; top: 14px; left: 16px; z-index: 10; color: #8fd8ff; font: 600 12px/1.2 "Segoe UI", system-ui, sans-serif; letter-spacing: 1px; text-shadow: 0 0 12px rgba(25, 183, 245, 0.6); }
    #subtle { position: fixed; bottom: 18px; right: 20px; z-index: 5; color: rgba(143, 216, 255, 0.35); font: 400 10px/1.3 monospace; letter-spacing: 1px; }
    #debug-panel { position: fixed; top: 70px; left: 16px; z-index: 30; display: none; background: rgba(5, 10, 18, 0.85); border: 1px solid rgba(125, 211, 238, 0.3); border-radius: 10px; padding: 10px 12px; color: #8fa2b8; font: 11px/1.5 monospace; max-height: 60vh; overflow: auto; white-space: pre; }
    body.debug #debug-panel { display: block; }
    #chat-log { position: fixed; left: 50%; bottom: 17vh; transform: translateX(-50%); width: min(440px, 86vw); z-index: 10; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    #chat-log .msg { background: rgba(10, 21, 34, 0.7); border: 1px solid rgba(125, 211, 238, 0.2); border-radius: 10px; padding: 6px 10px; color: #d7ecff; font: 13px/1.4 system-ui, sans-serif; max-width: 100%; white-space: pre-wrap; }
#voice-btn { position: fixed; top: 14px; right: 14px; z-index: 30; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(125, 211, 238, 0.35); background: rgba(10, 21, 34, 0.7); color: #e8f4ff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#voice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#mic-btn { position: fixed; top: 14px; right: 62px; z-index: 30; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(125, 211, 238, 0.35); background: rgba(10, 21, 34, 0.7); color: #e8f4ff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#mic-btn.listening { background: rgba(232, 192, 120, 0.25); border-color: #e8c078; color: #e8c078; box-shadow: 0 0 14px rgba(232, 192, 120, 0.55); }
    #webgl-message { display: none; position: fixed; inset: 0; z-index: 40; align-items: center; justify-content: center; text-align: center; color: #d7ecff; font: 15px/1.5 system-ui, sans-serif; padding: 24px; }
  </style>
</head>
<body>
  <div id="face-root"></div>
  <div id="webgl-message"></div>
  <div id="hud">A<b style="color:#19b7f5">.</b>LEXIS</div>
  <div id="chat-log"></div>
  <div id="composer">
    <form id="ask-form">
      <input id="ask-input" type="text" placeholder="¿Qué quieres que haga?" autocomplete="off" />
      <button type="submit">ENVIAR</button>
    </form>
  </div>
  <div id="debug-panel"></div>
  <div id="subtle">ALEXIS · Digital Presence v0.1 · Core state driven</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
